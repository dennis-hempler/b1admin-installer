name: Deploy AWS From Private Repo

# This workflow lives in your private deployment repository. It checks out three
# separate sources: this repo (your settings), the installer (the tooling), and the
# B1Admin frontend source. Free-text inputs are passed through `env:` rather than
# interpolated into shell text, so a crafted input cannot inject commands.

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Environment starter to deploy"
        required: true
        type: choice
        options:
          - staging
          - prod
      aws_region:
        description: "AWS region"
        required: true
        default: us-east-1
        type: string
      deployment_source:
        description: "How to provide the backend artifact"
        required: true
        default: api-repo
        type: choice
        options:
          - api-repo
          - package-manifest
          - backend-artifact
      installer_repo:
        description: "Installer repository to check out"
        required: true
        default: dennis-hempler/b1admin-installer
        type: string
      installer_ref:
        description: "Git ref for the installer checkout"
        required: true
        default: main
        type: string
      b1admin_repo:
        description: "B1Admin frontend source repository to check out"
        required: true
        default: ChurchApps/B1Admin
        type: string
      b1admin_ref:
        description: "Git ref for the B1Admin frontend checkout (default: last installer-tested version)"
        required: true
        default: 47b228ef93c86347301c87d0fa22d0f7abb52c78
        type: string
      api_repo:
        description: "Repository to check out when deployment_source=api-repo"
        required: false
        default: ChurchApps/Api
        type: string
      api_ref:
        description: "Git ref for the API repo checkout"
        required: false
        default: main
        type: string
      package_manifest_file:
        description: "Manifest path in the private repo when deployment_source=package-manifest"
        required: false
        default: ""
        type: string
      backend_artifact_source_file:
        description: "Backend zip path in the private repo when deployment_source=backend-artifact"
        required: false
        default: ""
        type: string
      migration_artifact_source_file:
        description: "Optional migration zip path in the private repo"
        required: false
        default: ""
        type: string
      dependencies_layer_source_file:
        description: "Optional layer zip path in the private repo"
        required: false
        default: ""
        type: string
      package_mode:
        description: "Backend packaging mode for api-repo deploys"
        required: true
        default: layered
        type: choice
        options:
          - layered
          - self-contained
      sync_app_config_secret:
        description: "Write app-config-secret.json from AWS_APP_CONFIG_SECRET_JSON"
        required: true
        default: false
        type: boolean
      sync_bootstrap_admin_secret:
        description: "Write bootstrap-admin-secret.json from AWS_BOOTSTRAP_ADMIN_SECRET_JSON"
        required: true
        default: false
        type: boolean
      run_api_migrations:
        description: "Run Api CLI migrations after deploy"
        required: true
        default: false
        type: boolean
      run_bootstrap_admin:
        description: "Seed the first admin login after deploy"
        required: true
        default: false
        type: boolean
      api_migration_action:
        description: "Migration action when enabled"
        required: true
        default: up
        type: choice
        options:
          - up
          - down
          - status
      api_migration_module:
        description: "Migration module when enabled"
        required: true
        default: all
        type: choice
        options:
          - all
          - membership
          - attendance
          - content
          - giving
          - messaging
          - doing
          - reporting
      verify_http_after_deploy:
        description: "Probe the frontend URL after deploy"
        required: true
        default: false
        type: boolean
      preview_only:
        description: "Run preflight only"
        required: true
        default: false
        type: boolean

jobs:
  deploy:
    name: Deploy ${{ inputs.environment }}
    runs-on: ubuntu-latest
    environment: aws-${{ inputs.environment }}
    env:
      AWS_ROLE_TO_ASSUME: ${{ secrets.AWS_ROLE_TO_ASSUME }}
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      # Every free-text input is exposed here and referenced as a shell variable.
      ENVIRONMENT: ${{ inputs.environment }}
      AWS_REGION: ${{ inputs.aws_region }}
      DEPLOYMENT_SOURCE: ${{ inputs.deployment_source }}
      API_REPO: ${{ inputs.api_repo }}
      API_REF: ${{ inputs.api_ref }}
      B1ADMIN_REPO: ${{ inputs.b1admin_repo }}
      B1ADMIN_REF: ${{ inputs.b1admin_ref }}
      PACKAGE_MANIFEST_FILE: ${{ inputs.package_manifest_file }}
      BACKEND_ARTIFACT_SOURCE_FILE: ${{ inputs.backend_artifact_source_file }}
      MIGRATION_ARTIFACT_SOURCE_FILE: ${{ inputs.migration_artifact_source_file }}
      DEPENDENCIES_LAYER_SOURCE_FILE: ${{ inputs.dependencies_layer_source_file }}
      PACKAGE_MODE: ${{ inputs.package_mode }}
      API_MIGRATION_ACTION: ${{ inputs.api_migration_action }}
      API_MIGRATION_MODULE: ${{ inputs.api_migration_module }}
      SYNC_APP_CONFIG_SECRET: ${{ inputs.sync_app_config_secret && 'true' || 'false' }}
      SYNC_BOOTSTRAP_ADMIN_SECRET: ${{ inputs.sync_bootstrap_admin_secret && 'true' || 'false' }}
      RUN_API_MIGRATIONS: ${{ inputs.run_api_migrations && 'true' || 'false' }}
      RUN_BOOTSTRAP_ADMIN: ${{ inputs.run_bootstrap_admin && 'true' || 'false' }}
      VERIFY_HTTP_AFTER_DEPLOY: ${{ inputs.verify_http_after_deploy && 'true' || 'false' }}
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout private deploy repo
        uses: actions/checkout@v4

      - name: Checkout installer
        uses: actions/checkout@v4
        with:
          repository: ${{ inputs.installer_repo }}
          ref: ${{ inputs.installer_ref }}
          path: installer
          token: ${{ secrets.INSTALLER_REPO_CHECKOUT_TOKEN || github.token }}

      - name: Checkout B1Admin frontend source
        uses: actions/checkout@v4
        with:
          repository: ${{ inputs.b1admin_repo }}
          ref: ${{ inputs.b1admin_ref }}
          path: B1Admin
          token: ${{ secrets.B1ADMIN_REPO_CHECKOUT_TOKEN || secrets.API_REPO_CHECKOUT_TOKEN || github.token }}

      - name: Checkout Api repo
        if: ${{ inputs.deployment_source == 'api-repo' }}
        uses: actions/checkout@v4
        with:
          repository: ${{ inputs.api_repo }}
          ref: ${{ inputs.api_ref }}
          path: Api
          token: ${{ secrets.API_REPO_CHECKOUT_TOKEN || github.token }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      # Dependencies install before AWS credentials exist in the job, so an install script can't use them
      # (security scan 2026-10-12, #7).
      - name: Install installer dependencies
        working-directory: installer
        run: npm ci --no-audit --no-fund

      - name: Install B1Admin frontend dependencies
        working-directory: B1Admin
        run: |
          corepack enable
          yarn install

      - name: Install Api dependencies
        if: ${{ inputs.deployment_source == 'api-repo' }}
        working-directory: Api
        run: |
          corepack enable
          yarn install

      - name: Configure AWS Credentials via OIDC
        if: ${{ env.AWS_ROLE_TO_ASSUME != '' }}
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.AWS_ROLE_TO_ASSUME }}
          role-session-name: b1admin-${{ inputs.environment }}-deploy
          role-duration-seconds: 3600
          aws-region: ${{ inputs.aws_region }}

      - name: Configure AWS Credentials via access keys
        if: ${{ env.AWS_ROLE_TO_ASSUME == '' }}
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ env.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ env.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ inputs.aws_region }}

      - name: Materialize app config secret into private repo
        if: ${{ inputs.sync_app_config_secret }}
        env:
          AWS_APP_CONFIG_SECRET_JSON: ${{ secrets.AWS_APP_CONFIG_SECRET_JSON }}
        run: |
          if [[ -z "${AWS_APP_CONFIG_SECRET_JSON}" ]]; then
            echo "Missing AWS_APP_CONFIG_SECRET_JSON secret for app config sync." >&2
            exit 1
          fi
          printf '%s' "${AWS_APP_CONFIG_SECRET_JSON}" > "environments/${ENVIRONMENT}/app-config-secret.json"

      - name: Materialize bootstrap admin secret into private repo
        if: ${{ inputs.sync_bootstrap_admin_secret }}
        env:
          AWS_BOOTSTRAP_ADMIN_SECRET_JSON: ${{ secrets.AWS_BOOTSTRAP_ADMIN_SECRET_JSON }}
        run: |
          if [[ -z "${AWS_BOOTSTRAP_ADMIN_SECRET_JSON}" ]]; then
            echo "Missing AWS_BOOTSTRAP_ADMIN_SECRET_JSON secret for bootstrap admin sync." >&2
            exit 1
          fi
          printf '%s' "${AWS_BOOTSTRAP_ADMIN_SECRET_JSON}" > "environments/${ENVIRONMENT}/bootstrap-admin-secret.json"

      - name: Preflight plan
        working-directory: installer
        run: |
          mkdir -p "deployment/${ENVIRONMENT}"
          prefix_path() { [[ -n "$1" ]] && printf '../%s' "$1" || printf ''; }
          npm run --silent plan:environment-deploy -- \
            --environment="${ENVIRONMENT}" \
            --environment-dir="../environments/${ENVIRONMENT}" \
            --region="${AWS_REGION}" \
            --deployment-source="${DEPLOYMENT_SOURCE}" \
            --api-repo-path="../Api" \
            --api-repo="${API_REPO}" \
            --api-ref="${API_REF}" \
            --package-manifest-file="$(prefix_path "${PACKAGE_MANIFEST_FILE}")" \
            --backend-artifact-source-file="$(prefix_path "${BACKEND_ARTIFACT_SOURCE_FILE}")" \
            --migration-artifact-source-file="$(prefix_path "${MIGRATION_ARTIFACT_SOURCE_FILE}")" \
            --dependencies-layer-source-file="$(prefix_path "${DEPENDENCIES_LAYER_SOURCE_FILE}")" \
            --sync-app-config-secret="${SYNC_APP_CONFIG_SECRET}" \
            --sync-bootstrap-admin-secret="${SYNC_BOOTSTRAP_ADMIN_SECRET}" \
            --run-api-migrations="${RUN_API_MIGRATIONS}" \
            --run-bootstrap-admin="${RUN_BOOTSTRAP_ADMIN}" \
            --api-migration-action="${API_MIGRATION_ACTION}" \
            --api-migration-module="${API_MIGRATION_MODULE}" \
            --api-migration-runner="data-api" \
            --verify-http-after-deploy="${VERIFY_HTTP_AFTER_DEPLOY}" \
            --output=markdown | tee "deployment/${ENVIRONMENT}/preflight-plan.md"

      - name: Stop after preview
        if: ${{ inputs.preview_only }}
        run: echo "Preview-only mode complete."

      - name: Deploy bootstrap
        if: ${{ !inputs.preview_only }}
        working-directory: installer
        env:
          CLOUDFORMATION_EXECUTION_ROLE_ARN: ${{ secrets.AWS_CLOUDFORMATION_EXECUTION_ROLE_ARN }}
        run: |
          npm run --silent deploy:bootstrap -- \
            --region="${AWS_REGION}" \
            --stack-name="b1admin-${ENVIRONMENT}-bootstrap" \
            --parameters-file="../environments/${ENVIRONMENT}/bootstrap-parameters.json"

      - name: Deploy split stack
        if: ${{ !inputs.preview_only }}
        working-directory: installer
        env:
          CLOUDFORMATION_EXECUTION_ROLE_ARN: ${{ secrets.AWS_CLOUDFORMATION_EXECUTION_ROLE_ARN }}
          # The frontend is built from the separately checked-out B1Admin source.
          B1ADMIN_FRONTEND_SOURCE: ${{ github.workspace }}/B1Admin
        run: |
          ARGS=(
            --region="${AWS_REGION}"
            --project-name=b1admin
            --environment="${ENVIRONMENT}"
            --bootstrap-stack-name="b1admin-${ENVIRONMENT}-bootstrap"
            --backend-parameters-file="../environments/${ENVIRONMENT}/backend-parameters.json"
            --frontend-parameters-file="../environments/${ENVIRONMENT}/frontend-parameters.json"
            --package-mode="${PACKAGE_MODE}"
            --frontend-source="${B1ADMIN_FRONTEND_SOURCE}"
          )

          if [[ "${DEPLOYMENT_SOURCE}" == "api-repo" ]]; then
            ARGS+=(--api-repo-path="../Api")
          elif [[ "${DEPLOYMENT_SOURCE}" == "package-manifest" ]]; then
            ARGS+=(--package-manifest-file="../${PACKAGE_MANIFEST_FILE}")
          else
            ARGS+=(--backend-artifact-source-file="../${BACKEND_ARTIFACT_SOURCE_FILE}")
            if [[ -n "${MIGRATION_ARTIFACT_SOURCE_FILE}" ]]; then
              ARGS+=(--migration-artifact-source-file="../${MIGRATION_ARTIFACT_SOURCE_FILE}")
            fi
            if [[ -n "${DEPENDENCIES_LAYER_SOURCE_FILE}" ]]; then
              ARGS+=(--dependencies-layer-source-file="../${DEPENDENCIES_LAYER_SOURCE_FILE}")
            fi
          fi

          if [[ "${SYNC_APP_CONFIG_SECRET}" == "true" ]]; then
            ARGS+=(--app-config-secret-file="../environments/${ENVIRONMENT}/app-config-secret.json")
          fi

          if [[ "${SYNC_BOOTSTRAP_ADMIN_SECRET}" == "true" ]]; then
            ARGS+=(--bootstrap-admin-secret-file="../environments/${ENVIRONMENT}/bootstrap-admin-secret.json")
          fi

          if [[ "${RUN_API_MIGRATIONS}" == "true" ]]; then
            ARGS+=(--run-api-migrations=true)
            ARGS+=(--api-migration-action="${API_MIGRATION_ACTION}")
            ARGS+=(--api-migration-module="${API_MIGRATION_MODULE}")
            ARGS+=(--api-migration-runner=data-api)
          fi

          if [[ "${RUN_BOOTSTRAP_ADMIN}" == "true" ]]; then
            ARGS+=(--run-bootstrap-admin=true)
          fi

          npm run --silent deploy:aws -- "${ARGS[@]}"

      - name: Save deployment evidence
        if: ${{ !inputs.preview_only }}
        working-directory: installer
        run: |
          npm run --silent save:split-stack-outputs -- \
            --environment="${ENVIRONMENT}" \
            --region="${AWS_REGION}" \
            --output=markdown

      # deploy:aws has no HTTP probe of its own, so the check runs here as its own
      # step. Passing --verify-http-after-deploy to the deploy was silently ignored
      # and the job went green without ever probing the site.
      - name: Verify deployed site over HTTP
        if: ${{ !inputs.preview_only && inputs.verify_http_after_deploy }}
        working-directory: installer
        run: |
          npm run --silent verify:split-stack -- \
            --environment="${ENVIRONMENT}" \
            --region="${AWS_REGION}" \
            --check-http=true \
            --output=markdown >> "${GITHUB_STEP_SUMMARY}"

      - name: Save source metadata
        if: ${{ !inputs.preview_only }}
        working-directory: installer
        env:
          WORKFLOW_RUN_ID: ${{ github.run_id }}
          PRIVATE_REPO_SHA: ${{ github.sha }}
        run: |
          mkdir -p "deployment/${ENVIRONMENT}"
          node -e '
            const fs = require("fs");
            const child = require("child_process");
            const git = (cwd) => child.execFileSync("git", ["rev-parse", "HEAD"], { cwd, encoding: "utf8" }).trim();
            const metadata = {
              ok: true,
              environment: process.env.ENVIRONMENT,
              writtenAt: new Date().toISOString(),
              githubActions: {
                runId: process.env.WORKFLOW_RUN_ID,
                privateRepoSha: process.env.PRIVATE_REPO_SHA
              },
              b1admin: {
                repo: process.env.B1ADMIN_REPO,
                ref: process.env.B1ADMIN_REF,
                sha: git("../B1Admin")
              },
              api: {
                repo: process.env.API_REPO,
                ref: process.env.API_REF,
                sha: process.env.DEPLOYMENT_SOURCE === "api-repo" ? git("../Api") : ""
              }
            };
            fs.writeFileSync(`deployment/${process.env.ENVIRONMENT}/source-metadata.json`, `${JSON.stringify(metadata, null, 2)}\n`);
          '

      - name: Write deployment summary
        if: ${{ !inputs.preview_only }}
        working-directory: installer
        run: |
          SUMMARY_FILE="deployment/${ENVIRONMENT}/deployment-summary.json"
          if [[ ! -f "${SUMMARY_FILE}" ]]; then
            echo "Missing deployment summary file: ${SUMMARY_FILE}" >&2
            exit 1
          fi
          npm run --silent show:deployment-summary -- --summary-file="${SUMMARY_FILE}" --output=markdown >> "${GITHUB_STEP_SUMMARY}"
          {
            echo ""
            echo "- Artifact: \`aws-${ENVIRONMENT}-deployment-evidence\`"
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Upload deployment evidence
        if: ${{ success() }}
        uses: actions/upload-artifact@v4
        with:
          name: aws-${{ inputs.environment }}-${{ inputs.preview_only && 'preflight-plan' || 'deployment-evidence' }}
          path: |
            installer/deployment/${{ inputs.environment }}/
          if-no-files-found: error
